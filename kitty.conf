# Kitty — базовый конфиг под Neovim / macOS
# Docs: https://sw.kovidgoyal.net/kitty/conf/

# --- Шрифт ---
font_family      JetBrainsMono Nerd Font Mono
bold_font        JetBrainsMono Nerd Font Mono Bold
italic_font      JetBrainsMono Nerd Font Mono Italic
bold_italic_font JetBrainsMono Nerd Font Mono Bold Italic
font_size 16.0
# thicken на Retina часто делает текст «мягче» — оставляем 0 ради чёткости
macos_thicken_font 0

# --- Курсор / выделение ---
cursor_shape block
cursor_blink_interval 0
copy_on_select clipboard
strip_trailing_spaces smart
underline_hyperlinks always
url_style curly

# --- Окно ---
confirm_os_window_close 0
window_padding_width 10
remember_window_size yes
initial_window_width 120c
initial_window_height 35c

# --- Стекло (macOS): лёгкое, чтобы не ломать читаемость nvim ---
background_opacity 0.94
background_blur 28

# --- Сплиты ---
draw_minimal_borders yes
active_border_color   #cba6f7
inactive_border_color #313244
bell_border_color     #f38ba8

# --- Табы (Catppuccin Mocha) ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# --- Скролл ---
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# --- macOS ---
macos_option_as_alt yes
macos_quit_when_last_window_closed yes

# --- Производительность / совместимость с TUI ---
repaint_delay 8
input_delay 1
sync_to_monitor yes
term xterm-kitty

# --- Shell integration (zsh) ---
shell_integration enabled

# --- Базовая тёмная палитра (нейтральная, близка к Mocha) ---
foreground #cdd6f4
background #1e1e2e
selection_foreground #1e1e2e
selection_background #f5e0dc
cursor #f5e0dc
url_color #89b4fa

color0  #45475a
color8  #585b70
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #cba6f7
color13 #cba6f7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
color15 #a6adc8

# --- Удобные хоткеи ---
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0
map cmd+enter new_window
map cmd+t new_tab
map cmd+w close_tab
